    title: Cluster Mesh Architecture And Prerequisites
    objectives:
    - Explain cross-cluster workload connectivity and independent control planes.
    - Identify unique cluster identity, compatible addressing, ports and routing mode.
    - State the cluster ID limit and the size of a mesh.
    - Evaluate policy, trust and failure-domain consequences.
    outline:
