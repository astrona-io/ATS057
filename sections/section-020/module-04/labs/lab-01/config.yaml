# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix Timeouts For A Global Service (LAB). UNTESTED: written from the documentation, not yet run.
# Two kind clusters side by side: "west" (this environment) and "east"
# (runtime.kind.clusters). Cluster Mesh is enabled and the two clusters are connected.
apiVersion: astrona.io/v1
metadata:
  name: ats-057-lab-020-04
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - hashicorp/http-echo:1.0
      - curlimages/curl:8.22.0
    networking:
      disableDefaultCNI: true
      podSubnet: 10.241.0.0/16
      serviceSubnet: 10.101.0.0/16
    clusters:
      - name: east
        image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
        preloadImages:
          - hashicorp/http-echo:1.0
          - curlimages/curl:8.22.0
        networking:
          disableDefaultCNI: true
          podSubnet: 10.242.0.0/16
          serviceSubnet: 10.102.0.0/16

bootstrap:
  init:
    - name: start-state
      description: Install Cilium in both clusters and deploy the Starfleet workloads
      type: file
      source: bootstrap/setup.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: reference-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: west-no-timeouts
      description: "Requests from the shuttle in west to probe do not time out"
      type: file
      source: validation/validate-west-no-timeouts.sh
      hint: "Find which cluster drops the requests. The agent in west picks backends of both clusters."
    - name: west-reaches-both-clusters
      description: "The shuttle in west is answered by probe pods of both clusters"
      type: file
      source: validation/validate-west-reaches-both-clusters.sh
      hint: "The global annotation must stay in both clusters."
    - name: drifter-still-denied
      description: "The drifter in outpost still cannot reach the probe pods of east"
      type: file
      source: validation/validate-drifter-still-denied.sh
      hint: "Allow the shuttle pods of both clusters only. Do not open the policy to every pod."
    - name: policy-and-global-kept
      description: "The policy in east exists and probe is still global"
      type: file
      source: validation/validate-policy-and-global-kept.sh
      hint: "Change the policy. Do not delete it and do not remove the annotation."

teardown:
  keepCluster: false
