# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats057-020
course_id: ATS057
exam_code: CCA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Service Discovery And Load Balancing Across Clusters"
questions:
  - id: ats057-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Declare a global service"
    source_readings:
      - sections/section-020/module-01/course-01-global-service-backends-and-cross-cluster-discovery.md
    prompt: |-
      Which conditions make a Service global across two clusters?
    options:
      - id: a
        text: "The same name and namespace in each cluster, and the annotation `service.cilium.io/global: \"true\"` on each."
        explanation: "Correct."
      - id: b
        text: "The annotation in one cluster only."
        explanation: "The other cluster takes no part without it."
      - id: c
        text: "Different names with the same selector."
        explanation: "The name and namespace identify the group."
      - id: d
        text: "A `ServiceExport` in each cluster."
        explanation: "That is the MCS-API method, not the annotation."
    correct_option: a
    explanation: "A global service is identified by namespace and name and needs the annotation in each cluster."

  - id: ats057-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the result of shared false"
    source_readings:
      - sections/section-020/module-01/course-01-global-service-backends-and-cross-cluster-discovery.md
    prompt: |-
      Both clusters mark `bridge` global, and `west` also sets `service.cilium.io/shared: "false"`. What do the clients see?
    options:
      - id: a
        text: "`west` clients see `west` only and `east` clients see both."
        explanation: "The reverse is true."
      - id: b
        text: "`west` clients see both clusters and `east` clients see `east` only."
        explanation: "Correct. `west` uses remote backends and offers none."
      - id: c
        text: "Both see `east` only."
        explanation: "`west` still uses remote backends."
      - id: d
        text: "The Service stops being global."
        explanation: "It stays global."
    correct_option: b
    explanation: "`shared: \"false\"` stops offering, not using."

  - id: ats057-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the backend list"
    source_readings:
      - sections/section-020/module-01/course-02-guided-practice.md
    prompt: |-
      How can you see which backends an agent holds for a global service?
    options:
      - id: a
        text: "With `kubectl get pods` in the cluster."
        explanation: "That lists local pods only."
      - id: b
        text: "With `cilium-dbg service list` in the agent of the cluster."
        explanation: "Correct. It shows the merged backends."
      - id: c
        text: "With `kubectl get ciliumnetworkpolicy`."
        explanation: "That lists policies."
      - id: d
        text: "With `cilium clustermesh connect`."
        explanation: "That command connects clusters."
    correct_option: b
    explanation: "The agent's service list shows the merged local and remote backends."

  - id: ats057-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use affinity local"
    source_readings:
      - sections/section-020/module-02/course-01-service-affinity.md
    prompt: |-
      `west` sets `service.cilium.io/affinity: local` on a global Service. All local pods then fail. What do clients in `west` reach?
    options:
      - id: a
        text: "Nothing. Requests fail."
        explanation: "Affinity falls back when no local backend is healthy."
      - id: b
        text: "The remote backends, because no local backend is healthy."
        explanation: "Correct."
      - id: c
        text: "The local pods anyway."
        explanation: "They are not healthy."
      - id: d
        text: "Clients in `east` are redirected."
        explanation: "Affinity changes the choice of the cluster that sets it."
    correct_option: b
    explanation: "`local` prefers local backends and falls back to remote ones."

  - id: ats057-020-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Use affinity remote"
    source_readings:
      - sections/section-020/module-02/course-01-service-affinity.md
    prompt: |-
      A team wants `west` clients to use the `scout` backends of `east` while any is healthy. Which setting is right?
    options:
      - id: a
        text: "`service.cilium.io/affinity: remote` on `scout` in `west`."
        explanation: "Correct."
      - id: b
        text: "`service.cilium.io/affinity: local` on `scout` in `east`."
        explanation: "That steers `east` clients."
      - id: c
        text: "`service.cilium.io/shared: \"false\"` on `scout` in `east`."
        explanation: "That stops `east` from offering its backends."
      - id: d
        text: "Remove the global annotation in `west`."
        explanation: "That removes remote backends."
    correct_option: a
    explanation: "Affinity is set in the cluster whose clients you steer."

  - id: ats057-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain cacheTTL"
    source_readings:
      - sections/section-020/module-02/course-02-unreachable-clusters-and-limits.md
    prompt: |-
      The connection from `west` to `east` is lost and `clustermesh.cacheTTL` is at its default. What does the agent in `west` do with the backends of `east`?
    options:
      - id: a
        text: "Removes them at once."
        explanation: "The default does not remove them."
      - id: b
        text: "Keeps them until the connection returns, because the default is `0s`, which never revokes the cache."
        explanation: "Correct."
      - id: c
        text: "Removes them after 30 seconds."
        explanation: "No such default exists."
      - id: d
        text: "Restarts the cluster."
        explanation: "The agent does not restart clusters."
    correct_option: b
    explanation: "A positive `cacheTTL` ends the keeping after that time."

  - id: ats057-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the MCS-API"
    source_readings:
      - sections/section-020/module-03/course-01-serviceexport-and-clusterset-dns.md
    prompt: |-
      Which name returns backends from every cluster that exported `bridge` in `starfleet`?
    options:
      - id: a
        text: "`bridge.starfleet.svc.cluster.local`"
        explanation: "That is the local name."
      - id: b
        text: "`bridge.starfleet.svc.clusterset.local`"
        explanation: "Correct."
      - id: c
        text: "`bridge.derived.starfleet`"
        explanation: "No such name exists."
      - id: d
        text: "`bridge.starfleet.mesh`"
        explanation: "No such domain exists."
    correct_option: b
    explanation: "The domain `clusterset.local` answers for exported Services."

  - id: ats057-020-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Resolve conflicts"
    source_readings:
      - sections/section-020/module-03/course-02-conflicts-and-endpointslice-synchronization.md
    prompt: |-
      Two clusters export `bridge` with different ports. Which definition does Cilium use?
    options:
      - id: a
        text: "The one of the newest export."
        explanation: "The oldest wins."
      - id: b
        text: "The one of the oldest export."
        explanation: "Correct."
      - id: c
        text: "The first one in alphabetical order of the cluster name."
        explanation: "The creation time decides."
      - id: d
        text: "Neither. The import is deleted."
        explanation: "The oldest definition is used."
    correct_option: b
    explanation: "The oldest export wins, so make the definitions match."

  - id: ats057-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the checklist for a service that does not balance"
    source_readings:
      - sections/section-020/module-04/course-01-a-checklist-for-a-service-that-does-not-balance.md
    prompt: |-
      All replies to `probe` in `west` come from `west`. The Service has the annotation `service.cilium.io/global: "true"` in `west` and no annotation in `east`. What is the cause?
    options:
      - id: a
        text: "The mesh is disabled."
        explanation: "The mesh can be healthy while one Service lacks the annotation."
      - id: b
        text: "The pods in `east` are not Ready."
        explanation: "The facts given point to the annotation."
      - id: c
        text: "The Service in `east` is not global, so `east` does not share its backends."
        explanation: "Correct. Each cluster needs the annotation to share its backends."
      - id: d
        text: "Cilium does not support global services."
        explanation: "It does, with the annotation."
    correct_option: c
    explanation: "Annotate the Service in every cluster."

  - id: ats057-020-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the service table of an agent"
    source_readings:
      - sections/section-020/module-04/course-02-read-the-service-state-of-an-agent.md
    prompt: |-
      Which command shows the backends that an agent holds for each Service address?
    options:
      - id: a
        text: "`cilium-dbg service list`"
        explanation: "Correct. It lists each frontend with its backends, including those of remote clusters."
      - id: b
        text: "`kubectl get nodes`"
        explanation: "It lists nodes, not backends."
      - id: c
        text: "`cilium clustermesh disconnect`"
        explanation: "It removes a connection."
      - id: d
        text: "`kubectl get serviceexport`"
        explanation: "It lists exports of the MCS-API, not agent state."
    correct_option: a
    explanation: "Use `cilium-dbg service list` and match the cluster IP of the Service."

  - id: ats057-020-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Test load balancing with evidence"
    source_readings:
      - sections/section-020/module-04/course-03-test-load-balancing-without-guessing.md
    prompt: |-
      A client sends 100 requests on one open HTTP keep-alive connection and all replies come from one cluster. What explains this?
    options:
      - id: a
        text: "Cluster Mesh is broken."
        explanation: "The result does not show that."
      - id: b
        text: "The Service has too many ports."
        explanation: "Port count does not cause this."
      - id: c
        text: "Cilium never balances across clusters."
        explanation: "It does for new connections."
      - id: d
        text: "Cilium balances each new connection, and one persistent connection stays on one backend."
        explanation: "Correct. Use a new connection for each request in the test."
    correct_option: d
    explanation: "Open a new connection for each request when you test the split."

  - id: ats057-020-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Plan capacity for the loss of a cluster"
    source_readings:
      - sections/section-020/module-04/course-04-capacity-and-failure-domains.md
    prompt: |-
      Two clusters each run at full capacity while sharing the load of a global service. What happens when one cluster fails?
    options:
      - id: a
        text: "The other cluster handles the load without change."
        explanation: "It receives twice its normal load."
      - id: b
        text: "The other cluster receives the whole load and is overloaded."
        explanation: "Correct. Each cluster needs capacity for the full load to survive the loss of the other."
      - id: c
        text: "The mesh adds pods automatically."
        explanation: "Cluster Mesh does not scale pods."
      - id: d
        text: "Requests stop and no backend is used."
        explanation: "Requests go to the remaining backends."
    correct_option: b
    explanation: "Size each cluster for the full load."
