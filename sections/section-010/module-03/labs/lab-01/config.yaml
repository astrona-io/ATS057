# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Restrict Cross-Cluster Traffic With A Cilium Network Policy (LAB). UNTESTED: written from the documentation, not yet run.
# Two kind clusters side by side: "west" (this environment) and "east"
# (runtime.kind.clusters). Cluster Mesh is enabled and the two clusters are connected.
apiVersion: astrona.io/v1
metadata:
  name: ats-057-lab-010-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - hashicorp/http-echo:1.0
      - curlimages/curl:8.22.0
    networking:
      disableDefaultCNI: true
      podSubnet: 10.241.0.0/16
      serviceSubnet: 10.101.0.0/16
    clusters:
      - name: east
        image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
        preloadImages:
          - hashicorp/http-echo:1.0
          - curlimages/curl:8.22.0
        networking:
          disableDefaultCNI: true
          podSubnet: 10.242.0.0/16
          serviceSubnet: 10.102.0.0/16

bootstrap:
  init:
    - name: start-state
      description: Install Cilium in both clusters and deploy the Starfleet workloads
      type: file
      source: bootstrap/setup.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: reference-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: policy-in-east
      description: "A CiliumNetworkPolicy exists in starfleet of east"
      type: file
      source: validation/validate-policy-in-east.sh
      hint: "Policies are not copied between clusters. Apply the policy in east, where the probe runs."
    - name: west-shuttle-allowed
      description: "The shuttle in west can reach the probe pod in east"
      type: file
      source: validation/validate-west-shuttle-allowed.sh
      hint: "Allow the endpoints with app=shuttle and the label io.cilium.k8s.policy.cluster=west."
    - name: west-drifter-denied
      description: "The drifter in outpost of west cannot reach the probe pod in east"
      type: file
      source: validation/validate-west-drifter-denied.sh
      hint: "Select the source by labels only: do not use a wildcard source."
    - name: east-lookalike-denied
      description: "The shuttle in east (same labels as the shuttle in west) cannot reach the probe pod"
      type: file
      source: validation/validate-east-lookalike-denied.sh
      hint: "A policy that names the source cluster must not allow a pod with the same labels in the local cluster."

teardown:
  keepCluster: false
