# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Disconnect A Cluster From The Mesh (LAB). UNTESTED: written from the documentation, not yet run.
# Two kind clusters side by side: "west" (this environment) and "east"
# (runtime.kind.clusters). Cluster Mesh is enabled and the two clusters are connected.
apiVersion: astrona.io/v1
metadata:
  name: ats-057-lab-010-04
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - hashicorp/http-echo:1.0
      - curlimages/curl:8.22.0
    networking:
      disableDefaultCNI: true
      podSubnet: 10.241.0.0/16
      serviceSubnet: 10.101.0.0/16
    clusters:
      - name: east
        image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
        preloadImages:
          - hashicorp/http-echo:1.0
          - curlimages/curl:8.22.0
        networking:
          disableDefaultCNI: true
          podSubnet: 10.242.0.0/16
          serviceSubnet: 10.102.0.0/16

bootstrap:
  init:
    - name: start-state
      description: Install Cilium in both clusters and deploy the Starfleet workloads
      type: file
      source: bootstrap/setup.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: reference-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: west-has-no-east-entry
      description: "The secret of west has no entry for east"
      type: file
      source: validation/validate-west-has-no-east-entry.sh
      hint: "Use cilium clustermesh disconnect with --context and --destination-context."
    - name: east-has-no-west-entry
      description: "The secret of east has no entry for west"
      type: file
      source: validation/validate-east-has-no-west-entry.sh
      hint: "One disconnect command removes both directions."
    - name: west-cannot-reach-east-pod
      description: "A pod in west no longer reaches a pod in east by its pod IP"
      type: file
      source: validation/validate-west-cannot-reach-east-pod.sh
      hint: "Wait for the agents to remove the remote endpoints, then test again."
    - name: mesh-apiserver-still-ready
      description: "The clustermesh-apiserver still runs in both clusters"
      type: file
      source: validation/validate-mesh-apiserver-still-ready.sh
      hint: "Disconnect only. Do not run cilium clustermesh disable."

teardown:
  keepCluster: false
